name: milantra_app
description: "Milantra - Private. Secure. Connected. Instant messaging and WebRTC calling."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend & Database
  supabase_flutter: ^2.8.0

  # Realtime WebRTC Audio & Video Calling
  flutter_webrtc: ^0.11.7

  # State Management & Service Locator
  provider: ^6.1.2

  # Security & Biometrics
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Media, Camera & Audio
  image_picker: ^1.1.2
  record: ^5.1.2
  audioplayers: ^6.0.0
  cached_network_image: ^3.4.1
  file_picker: ^8.1.2
  path_provider: ^2.1.4

  # UI, Icons & Polish
  google_fonts: ^6.2.1
  lucide_icons: ^0.252.0
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
